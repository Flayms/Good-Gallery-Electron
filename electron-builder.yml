appId: com.goodgallery.app
productName: Good Gallery
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  - from: drizzle
    to: migrations
    filter: ['**/*']
# Native addons with their DLLs and the executables spawned by the indexer can't run from inside the asar.
asarUnpack:
  - node_modules/@img/**
  - node_modules/better-sqlite3/**
  - node_modules/exiftool-vendored.exe/**
  - node_modules/ffmpeg-static/**
# Native deps ship N-API prebuilds; no Electron ABI rebuild needed.
npmRebuild: false
win:
  target:
    - nsis
    # Portable: the unpacked app, extracted once (a single-file portable exe unpacks ~550 MB on every launch).
    - zip
  executableName: good-gallery
  # Names the zip; nsis sets its own.
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
